{{/*
The controller's operating role. Distinct from the five SoD ClusterRoles
in clusterroles.yaml — those are for cluster admins to assign to humans
and external services. This one is what the controller itself needs to
run, bound to its ServiceAccount.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel.controllerName" . }}-manager
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["sentinel.sentinel.io"]
  resources: ["governancescans"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["sentinel.sentinel.io"]
  resources: ["governancescans/finalizers"]
  verbs: ["update"]
- apiGroups: ["sentinel.sentinel.io"]
  resources: ["governancescans/status"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel.controllerName" . }}-manager
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel.controllerName" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "sentinel.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
