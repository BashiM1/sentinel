# Separation-of-Duties role: bind this to the identity that runs scans.
# Permits reading GovernanceScans, writing scan status, and managing
# scanner Jobs — but NOT approving findings, executing remediation, or
# editing scan policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-scanner
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
