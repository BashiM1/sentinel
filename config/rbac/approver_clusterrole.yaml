# Separation-of-Duties role: bind this to a human (or group) authorised
# to approve or reject scan findings. Read-only on the resource itself;
# patch on /status is the channel through which the approval decision is
# recorded (see hack/approve.sh, hack/reject.sh).
#
# Critical: no `update` verb on /status — only `patch`. Update would
# allow rewriting the entire status, including prior audit references
# and findings. Patch lets the approver set only their decision fields.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-approver
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans/status
  verbs:
  - get
  - patch
