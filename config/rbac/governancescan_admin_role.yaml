# This rule is not used by the project sentinel itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sentinel.sentinel.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/managed-by: kustomize
  name: governancescan-admin-role
rules:
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans
  verbs:
  - '*'
- apiGroups:
  - sentinel.sentinel.io
  resources:
  - governancescans/status
  verbs:
  - get
